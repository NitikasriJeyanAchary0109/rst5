<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline Verification Workbench</title>

<!-- Fonts: Inter (Clean UI) & JetBrains Mono (Audit Telemetry & Code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- React 18 UMD builds + Babel standalone for in-browser JSX compilation -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin onerror="this.onerror=null;this.src='vendor/react.production.min.js'"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin onerror="this.onerror=null;this.src='vendor/react-dom.production.min.js'"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onerror="this.onerror=null;this.src='vendor/babel.min.js'"></script>

<style>
  :root {
    --bg-base: #0c0e12;
    --bg-surface: #141824;
    --bg-surface-elevated: #1a2030;
    --border-subtle: #232c3d;
    --border-focus: #3b82f6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --proof-green: #10b981;
    --proof-green-bg: rgba(16, 185, 129, 0.12);
    --proof-green-border: rgba(16, 185, 129, 0.35);
    --warn-amber: #f59e0b;
    --warn-amber-bg: rgba(245, 158, 11, 0.12);
    --warn-amber-border: rgba(245, 158, 11, 0.35);
    --error-red: #ef4444;
    --error-red-bg: rgba(239, 68, 68, 0.12);
    --error-red-border: rgba(239, 68, 68, 0.35);
    --telemetry-sky: #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-base);
    color: var(--text-primary);
    line-height: 1.55;
    padding: 2.5rem 1.5rem;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    position: relative;
    width: 100%;
  }

  .workbench {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* Telemetry Top Bar */
  .telemetry-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }

  .telemetry-title {
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .telemetry-title strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .telemetry-nodes {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .node-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
  }

  .node-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.15s ease;
  }
  .node-dot.active {
    background: var(--proof-green);
    box-shadow: 0 0 6px var(--proof-green);
  }
  .node-dot.inactive {
    background: var(--error-red);
    box-shadow: 0 0 6px var(--error-red);
  }

  /* Header */
  .workbench-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .header-text h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.025em;
  }

  .header-text p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
  }

  /* Workbench Panels */
  .panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 1.5rem;
    transition: border-color 0.15s ease;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
  }

  .panel-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .panel-action-btn {
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 0.3rem 0.65rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .panel-action-btn:hover {
    color: #fff;
    border-color: var(--text-muted);
    background: var(--bg-surface-elevated);
  }

  /* Dropzone */
  .dropzone {
    border: 1px dashed var(--border-subtle);
    border-radius: 6px;
    padding: 2.25rem 1.5rem;
    text-align: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.01);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--border-focus);
    background: rgba(59, 130, 246, 0.04);
  }

  .dropzone input { display: none; }

  .dropzone-prompt {
    font-weight: 500;
    color: var(--text-primary);
    font-size: 0.95rem;
  }

  .dropzone-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
  }

  .file-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    margin-top: 1rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  .file-banner-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .file-name {
    color: var(--text-primary);
    font-weight: 600;
  }

  .file-time {
    color: var(--text-muted);
    font-size: 0.75rem;
  }

  /* Ingest Cryptographic Proof Details */
  .ingest-proof-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }

  .proof-item {
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 0.6rem 0.8rem;
  }

  .proof-label {
    color: var(--text-muted);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .proof-value {
    color: var(--text-primary);
    font-weight: 500;
    margin-top: 0.15rem;
    word-break: break-all;
  }

  /* Preview Table */
  .preview-wrap {
    margin-top: 1.25rem;
    border-top: 1px solid var(--border-subtle);
    padding-top: 1rem;
  }

  .preview-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 0.78rem;
  }

  th, td {
    padding: 0.55rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }

  th {
    background: #0f131c;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.72rem;
  }

  td {
    color: var(--text-primary);
  }

  tr:last-child td {
    border-bottom: none;
  }

  /* Synchronization Ledger */
  .sync-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .sync-status-queued {
    background: var(--warn-amber-bg);
    color: var(--warn-amber);
    border: 1px solid var(--warn-amber-border);
  }

  .sync-status-loading {
    background: rgba(56, 189, 248, 0.12);
    color: var(--telemetry-sky);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .sync-status-complete {
    background: var(--proof-green-bg);
    color: var(--proof-green);
    border: 1px solid var(--proof-green-border);
  }

  .sync-status-failed {
    background: var(--error-red-bg);
    color: var(--error-red);
    border: 1px solid var(--error-red-border);
  }

  .sync-status-awaiting {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
  }

  .ledger-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .ledger-card {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
  }

  .ledger-metric {
    font-family: var(--font-mono);
    font-size: 2.25rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .ledger-metric.committed {
    color: var(--proof-green);
  }

  .ledger-metric.failed {
    color: var(--error-red);
  }

  .ledger-label {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 0.25rem;
  }

  /* Functional Progress Bar */
  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--telemetry-sky);
    transition: width 0.3s ease, background-color 0.3s ease;
  }
  .progress-fill.complete {
    background: var(--proof-green);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.4rem;
  }

  /* Query Explorer */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .chip-btn {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip-btn:hover {
    color: #fff;
    border-color: var(--border-focus);
  }

  .chat-input-bar {
    display: flex;
    gap: 0.6rem;
  }

  .query-input {
    flex: 1;
    background: #090b0f;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    color: #fff;
    font-size: 0.92rem;
    font-family: var(--font-sans);
    transition: border-color 0.15s ease;
  }
  .query-input:focus {
    outline: none;
    border-color: var(--border-focus);
  }

  .query-submit-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 0.84rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: background 0.15s ease;
  }
  .query-submit-btn:hover:not(:disabled) {
    background: #1d4ed8;
  }
  .query-submit-btn:disabled {
    background: var(--border-subtle);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* Evidence Trace History */
  .evidence-thread {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .evidence-entry {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 1.25rem;
    transition: opacity 0.25s ease;
  }

  .evidence-entry.hero-reveal {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    border-color: rgba(59, 130, 246, 0.35);
  }

  .evidence-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .evidence-q {
    font-weight: 600;
    color: #fff;
    font-size: 0.92rem;
  }

  .grounding-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .grounding-tag.verified {
    background: var(--proof-green-bg);
    color: var(--proof-green);
    border: 1px solid var(--proof-green-border);
  }
  .grounding-tag.unverified {
    background: var(--warn-amber-bg);
    color: var(--warn-amber);
    border: 1px solid var(--warn-amber-border);
  }

  .evidence-answer {
    font-size: 0.95rem;
    color: var(--text-primary);
    line-height: 1.6;
    margin-bottom: 0.75rem;
  }

  details.trace-accordion {
    border-top: 1px solid var(--border-subtle);
    padding-top: 0.6rem;
    margin-top: 0.6rem;
  }

  summary.trace-summary {
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-secondary);
    user-select: none;
  }
  summary.trace-summary:hover {
    color: #fff;
  }

  pre.trace-code {
    background: #080a0e;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: #93c5fd;
    margin-top: 0.4rem;
    overflow-x: auto;
  }

  pre.trace-raw {
    color: #a7f3d0;
    max-height: 160px;
    overflow-y: auto;
  }

  /* Alerts */
  .alert-box {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-family: var(--font-mono);
  }
  .alert-error {
    background: var(--error-red-bg);
    border: 1px solid var(--error-red-border);
    color: var(--error-red);
  }

  /* Micro Spinner */
  .micro-spinner {
    display: inline-block;
    width: 8px;
    height: 8px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const API_BASE = "http://localhost:8000";

  // Robust CSV parser supporting quotes, commas, and CRLF
  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length === 0) return { headers: [], rows: [], total: 0 };

    const splitLine = (line) => {
      const res = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          res.push(cur.trim().replace(/^["']|["']$/g, ""));
          cur = "";
        } else {
          cur += char;
        }
      }
      res.push(cur.trim().replace(/^["']|["']$/g, ""));
      return res;
    };

    const headers = splitLine(lines[0]);
    const rows = lines.slice(1, 11).map(splitLine);
    return { headers, rows, total: lines.length - 1 };
  }

  function App() {
    // 1. Real Health Polling (API, Kafka, Neo4j)
    const [health, setHealth] = useState({ api: false, kafka: false, neo4j: false });

    // 2. Ingestion & Preview State
    const [fileName, setFileName] = useState("");
    const [fileSize, setFileSize] = useState("");
    const [uploadTimestamp, setUploadTimestamp] = useState("");
    const [isDragOver, setIsDragOver] = useState(false);
    const [uploadError, setUploadError] = useState("");
    const [jobMeta, setJobMeta] = useState(null); // { job_id, rows_received, status }
    const [previewHeaders, setPreviewHeaders] = useState([]);
    const [previewRows, setPreviewRows] = useState([]);
    const [previewTotalRows, setPreviewTotalRows] = useState(0);
    const fileInputRef = useRef(null);

    // 3. Synchronization Ledger State
    const [statusData, setStatusData] = useState(null);
    const [statusError, setStatusError] = useState("");
    const [isPolling, setIsPolling] = useState(false);

    // Single Hero Animated Beat: Tweened row count on completion
    const [animatedLoadedCount, setAnimatedLoadedCount] = useState(0);
    const prevStatusRef = useRef("");

    // 4. Query & Proof State (Last 5 Q&A pairs)
    const [question, setQuestion] = useState("");
    const [isAsking, setIsAsking] = useState(false);
    const [chatError, setChatError] = useState("");
    const [chatHistory, setChatHistory] = useState([]);

    // Live Telemetry Health Polling: polls /health every 10s
    useEffect(() => {
      const checkHealth = async () => {
        try {
          const res = await fetch(`${API_BASE}/health`);
          if (res.ok) {
            const data = await res.json();
            setHealth({
              api: data.status === "ok",
              kafka: !!data.kafka_connected,
              neo4j: !!data.neo4j_connected
            });
          } else {
            setHealth({ api: false, kafka: false, neo4j: false });
          }
        } catch (err) {
          setHealth({ api: false, kafka: false, neo4j: false });
        }
      };

      checkHealth();
      const interval = setInterval(checkHealth, 10000);
      return () => clearInterval(interval);
    }, []);

    // File Selection & Upload
    const handleFile = async (file) => {
      if (!file) return;
      setUploadError("");
      setFileName(file.name);

      const sizeKB = (file.size / 1024).toFixed(1) + " KB";
      setFileSize(sizeKB);

      const nowStr = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      setUploadTimestamp(nowStr);

      // Client-side CSV preview parse (first 10 rows)
      try {
        const text = await file.text();
        const parsed = parseCSV(text);
        setPreviewHeaders(parsed.headers);
        setPreviewRows(parsed.rows);
        setPreviewTotalRows(parsed.total);
      } catch (err) {
        console.error("CSV parse failed:", err);
      }

      // Upload to API
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API_BASE}/ingest`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Server returned ${res.status}: ${body}`);
        }
        const data = await res.json();
        setJobMeta(data);
        setStatusData({
          status: data.status || "queued",
          rows_total: data.rows_received,
          rows_loaded: 0,
          rows_failed: 0,
        });
        setAnimatedLoadedCount(0);
        setIsPolling(true);
      } catch (err) {
        setUploadError(`Upload failed: ${err.message}. Is API running on ${API_BASE}?`);
        console.error(err);
      }
    };

    // Polling Status: GET /status?job_id=... every 1.5s
    useEffect(() => {
      if (!isPolling || !jobMeta?.job_id) return;

      const fetchStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/status?job_id=${encodeURIComponent(jobMeta.job_id)}`);
          if (!res.ok) {
            setStatusError(`Status fetch error (${res.status}).`);
            setIsPolling(false);
            return;
          }
          const data = await res.json();
          setStatusData(data);

          if (data.status === "complete" || data.status === "failed") {
            setIsPolling(false);
          }
        } catch (err) {
          setStatusError(err.message);
          setIsPolling(false);
          console.error(err);
        }
      };

      fetchStatus();
      const timer = setInterval(fetchStatus, 1500);
      return () => clearInterval(timer);
    }, [isPolling, jobMeta?.job_id]);

    // Single Hero Animation: When status flips to 'complete', tween row count 0 -> target over ~800ms
    useEffect(() => {
      if (!statusData) return;

      const currentStatus = statusData.status || "";
      const targetCount = statusData.rows_loaded || 0;

      // Trigger animation on arrival of complete or first load count
      if (currentStatus === "complete" && prevStatusRef.current !== "complete" && targetCount > 0) {
        const startTime = performance.now();
        const duration = 800; // 800ms tween

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          // Ease-out cubic curve
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(easeOut * targetCount);
          setAnimatedLoadedCount(current);

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            setAnimatedLoadedCount(targetCount);
          }
        };
        requestAnimationFrame(step);
      } else if (currentStatus !== "complete") {
        setAnimatedLoadedCount(targetCount);
      }

      prevStatusRef.current = currentStatus;
    }, [statusData]);

    // Query Submission (Preserves last 5 Q&A pairs)
    const handleAsk = async (qText) => {
      const q = (qText !== undefined ? qText : question).trim();
      if (!q || isAsking) return;

      setChatError("");
      setIsAsking(true);

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Chat API error (${res.status}): ${body}`);
        }
        const data = await res.json();
        const entry = {
          id: Date.now(),
          question: q,
          answer: data.answer || "(no answer returned)",
          cypher: data.cypher || "(no cypher returned)",
          result: data.result ?? [],
          grounded: !!data.grounded,
          time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        };
        // Keep last 5 Q&A pairs, newest first
        setChatHistory(prev => [entry, ...prev].slice(0, 5));
        setQuestion("");
      } catch (err) {
        setChatError(`Query execution error: ${err.message}`);
        console.error(err);
      } finally {
        setIsAsking(false);
      }
    };

    // Reset All State
    const handleReset = () => {
      setFileName("");
      setFileSize("");
      setUploadTimestamp("");
      setUploadError("");
      setJobMeta(null);
      setPreviewRows([]);
      setPreviewHeaders([]);
      setPreviewTotalRows(0);
      setStatusData(null);
      setStatusError("");
      setIsPolling(false);
      setAnimatedLoadedCount(0);
      setQuestion("");
      setChatError("");
      setChatHistory([]);
      prevStatusRef.current = "";
      if (fileInputRef.current) fileInputRef.current.value = "";
    };

    // Progress percentage calculation
    const progressPct = statusData && statusData.rows_total > 0
      ? Math.min(100, Math.round(((statusData.rows_loaded || 0) / statusData.rows_total) * 100))
      : 0;

    return (
      <div className="workbench">
        {/* Telemetry Bar (Replacing middle-dot template chrome) */}
        <div className="telemetry-bar">
          <div className="telemetry-title">
            <span>Cluster Telemetry</span>
            <span>·</span>
            <strong>kafka:9092 ➔ neo4j:7687</strong>
          </div>
          <div className="telemetry-nodes">
            <span className="node-indicator">
              <span className={`node-dot ${health.api ? "active" : "inactive"}`} /> API
            </span>
            <span className="node-indicator">
              <span className={`node-dot ${health.kafka ? "active" : "inactive"}`} /> Kafka
            </span>
            <span className="node-indicator">
              <span className={`node-dot ${health.neo4j ? "active" : "inactive"}`} /> Neo4j
            </span>
          </div>
        </div>

        {/* Workbench Header */}
        <div className="workbench-header">
          <div className="header-text">
            <h1>Pipeline Verification Workbench</h1>
            <p>End-to-end audit console for CSV ingestion, Kafka decoupled streaming, and grounded Neo4j query proof.</p>
          </div>
        </div>

        {/* Module 1: Dataset Ingestion */}
        <section className="panel">
          <div className="panel-header">
            <div className="panel-title">
              <span>Dataset Ingestion</span>
            </div>
            {jobMeta && (
              <button className="panel-action-btn" onClick={handleReset} title="Reset workbench state">
                Reset Workbench
              </button>
            )}
          </div>

          <div
            className={`dropzone ${isDragOver ? "dragover" : ""}`}
            id="dropzone"
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
            onDragLeave={() => setIsDragOver(false)}
            onDrop={(e) => {
              e.preventDefault();
              setIsDragOver(false);
              if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            }}
          >
            <input
              type="file"
              id="fileInput"
              ref={fileInputRef}
              accept=".csv"
              onChange={(e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
              }}
            />
            <div className="dropzone-prompt" id="dropzoneText">
              {fileName ? fileName : "Drop CSV spreadsheet to verify ingestion"}
            </div>
            <div className="dropzone-hint">
              {fileName ? `Size: ${fileSize} — Click to choose different file` : "Streams row-by-row into Kafka 'csv-rows' topic"}
            </div>
          </div>

          {fileName && (
            <div className="file-banner">
              <div className="file-banner-meta">
                <span className="file-name">{fileName}</span>
                <span className="file-time">({fileSize})</span>
              </div>
              <div className="file-time">Uploaded at {uploadTimestamp}</div>
            </div>
          )}

          {uploadError && <div className="alert-box alert-error" id="uploadError">{uploadError}</div>}

          {jobMeta && (
            <div className="ingest-proof-strip" id="ingestMeta">
              <div className="proof-item">
                <div className="proof-label">Dataset ID (SHA-256)</div>
                <div className="proof-value" id="metaJobId">{jobMeta.job_id}</div>
              </div>
              <div className="proof-item">
                <div className="proof-label">Dispatched Rows</div>
                <div className="proof-value" id="metaRowsReceived">{jobMeta.rows_received}</div>
              </div>
              <div className="proof-item">
                <div className="proof-label">Initial Status</div>
                <div className="proof-value" id="metaStatus">{jobMeta.status}</div>
              </div>
            </div>
          )}

          {/* CSV Row Preview Table immediately under Ingestion */}
          {previewHeaders.length > 0 && (
            <div className="preview-wrap" id="previewTableWrap">
              <div className="preview-header">
                <span>Source CSV Preview</span>
                <span>Displaying first 10 of {previewTotalRows} parsed rows</span>
              </div>
              <div className="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: "45px" }}>#</th>
                      {previewHeaders.map((h, i) => (
                        <th key={i}>{h.trim()}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {previewRows.map((r, rIdx) => (
                      <tr key={rIdx}>
                        <td style={{ color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{rIdx + 1}</td>
                        {r.map((cell, cIdx) => (
                          <td key={cIdx}>{(cell || "").trim()}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </section>

        {/* Module 2: Graph Synchronization Ledger */}
        <section className="panel">
          <div className="panel-header">
            <div className="panel-title">
              <span>Graph Synchronization Ledger</span>
            </div>
            <div id="statusPanel">
              {statusData ? (
                <span className={`sync-status-badge sync-status-${statusData.status || "queued"}`}>
                  {(statusData.status === "queued" || statusData.status === "loading") && (
                    <span className="micro-spinner" />
                  )}
                  {statusData.status || "queued"}
                </span>
              ) : (
                <span className="sync-status-badge sync-status-awaiting">Awaiting Dataset</span>
              )}
            </div>
          </div>

          {/* Ledger Metric Cards */}
          <div className="ledger-grid">
            <div className="ledger-card">
              <div className="ledger-metric">
                {statusData ? (statusData.rows_total ?? "—") : "—"}
              </div>
              <div className="ledger-label">Total Source Rows</div>
            </div>

            {/* Hero Element: Animated Count on Complete */}
            <div className="ledger-card" style={{ borderColor: statusData?.status === "complete" ? "var(--proof-green-border)" : "var(--border-subtle)" }}>
              <div className="ledger-metric committed">
                {statusData ? animatedLoadedCount : "—"}
              </div>
              <div className="ledger-label">Committed (:Row Nodes)</div>
            </div>

            <div className="ledger-card">
              <div className={`ledger-metric ${statusData && statusData.rows_failed > 0 ? "failed" : ""}`}>
                {statusData ? (statusData.rows_failed ?? 0) : "—"}
              </div>
              <div className="ledger-label">Failed / Dropped</div>
            </div>
          </div>

          {/* Functional Progress Track */}
          {statusData && statusData.rows_total > 0 && (
            <div>
              <div className="progress-track">
                <div
                  className={`progress-fill ${statusData.status === "complete" ? "complete" : ""}`}
                  style={{ width: `${progressPct}%` }}
                />
              </div>
              <div className="progress-meta">
                <span>Synchronized with Graph Database</span>
                <span>{progressPct}% ({animatedLoadedCount} / {statusData.rows_total} rows)</span>
              </div>
            </div>
          )}

          {statusError && <div className="alert-box alert-error">{statusError}</div>}
        </section>

        {/* Module 3: Query & Proof Explorer */}
        <section className="panel">
          <div className="panel-header">
            <div className="panel-title">
              <span>Query &amp; Proof Explorer</span>
            </div>
          </div>

          {/* Verification Chips */}
          <div className="chips-row">
            {[
              "How many rows in total?",
              "What columns exist in this dataset?",
              "Show top 5 by amount",
              "How many rows belong to Billing?"
            ].map((chipText, i) => (
              <button
                key={i}
                type="button"
                className="chip-btn"
                onClick={() => {
                  setQuestion(chipText);
                  handleAsk(chipText);
                }}
                disabled={isAsking}
              >
                {chipText}
              </button>
            ))}
          </div>

          <div className="chat-input-bar">
            <input
              type="text"
              id="chatInput"
              className="query-input"
              placeholder="Ask natural language question (e.g. 'How many rows belong to Billing?')..."
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") handleAsk();
              }}
              disabled={isAsking}
            />
            <button
              id="chatBtn"
              className="query-submit-btn"
              onClick={() => handleAsk()}
              disabled={isAsking || !question.trim()}
            >
              {isAsking ? (
                <>
                  <span className="micro-spinner" /> Querying…
                </>
              ) : (
                "Query Graph"
              )}
            </button>
          </div>

          {chatError && <div id="chatError" className="alert-box alert-error">{chatError}</div>}

          {/* Evidence Thread: Last 5 Q&A Pairs with Visual Hierarchy */}
          <div id="chatResult" className="evidence-thread">
            {chatHistory.map((item, index) => {
              const opacities = [1.0, 0.75, 0.55, 0.40, 0.30];
              const itemOpacity = opacities[index] ?? 0.30;
              const isLatest = index === 0;

              return (
                <div
                  key={item.id}
                  className={`evidence-entry ${isLatest ? "hero-reveal" : ""}`}
                  style={{ opacity: itemOpacity }}
                >
                  <div className="evidence-header">
                    <div className="evidence-q">"{item.question}"</div>
                    <div style={{ display: "flex", alignItems: "center", gap: "0.75rem" }}>
                      <span style={{ fontSize: "0.7rem", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                        {item.time}
                      </span>
                      <span className={`grounding-tag ${item.grounded ? "verified" : "unverified"}`}>
                        {item.grounded ? "✓ Grounded in Graph" : "⚠ Not Grounded"}
                      </span>
                    </div>
                  </div>

                  <div className="evidence-answer">
                    {item.answer}
                  </div>

                  <details className="trace-accordion">
                    <summary className="trace-summary">Inspect Cypher Query &amp; Graph Result</summary>
                    <pre className="trace-code">{item.cypher}</pre>
                    <pre className="trace-code trace-raw">{JSON.stringify(item.result, null, 2)}</pre>
                  </details>
                </div>
              );
            })}
          </div>
        </section>
      </div>
    );
  }

  // Safe Mount Guard (Strictly prevents duplicate mount nodes)
  const rootElement = document.getElementById("root");
  if (rootElement && !window.__APP_INITIALIZED__) {
    window.__APP_INITIALIZED__ = true;
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  }
</script>
</body>
</html>
